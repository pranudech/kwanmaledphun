version: "3.8"

services:
  nginx-proxy:
    image: jwilder/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-tier

  nginx-letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-letsencrypt
    restart: unless-stopped
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-tier

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: P7CcI[T~k)i8
      MYSQL_DATABASE: kwanmxwf_main
      MYSQL_USER: kwanmxwf_main
      MYSQL_PASSWORD: P7CcI[T~k)i8
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - proxy-tier

  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=kwanmaledphun.com,www.kwanmaledphun.com
      - LETSENCRYPT_HOST=kwanmaledphun.com,www.kwanmaledphun.com
      - LETSENCRYPT_EMAIL=pranudech@gmail.com
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=kwanmxwf_main
      - DB_PASSWORD=yourpassword
      - DB_NAME=kwanmxwf_main
    expose:
      - "3000"
    depends_on:
      - mysql-db
    networks:
      - proxy-tier

volumes:
  db_data:

networks:
  proxy-tier:
    driver: bridge
